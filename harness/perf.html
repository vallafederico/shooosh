<!doctype html>
<html lang="en"><meta charset="utf-8"><title>shooosh runtime audit</title>
<style>body{font:14px system-ui;margin:24px;background:#faf9f5;color:#222}button{padding:10px}table{border-collapse:collapse;margin:20px 0}td,th{border:1px solid #ccc;padding:8px;text-align:left}#fixture{position:relative;width:600px;height:360px;border:0}#fixture>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#fixture [data-grid]{display:grid;grid-template-columns:repeat(10,48px);gap:6px}#fixture img{display:block;width:48px;height:30px}#fixture .field{display:flex;align-items:center;padding:14px 18px;gap:12px;border:1px solid #b9bfaf;border-radius:18px;width:380px;background:#f8f7f1}#fixture input{font:16px/24px system-ui;border:0;background:transparent;width:100%;outline:none}#fixture .field[data-canvas-input=active]{background:transparent;border-color:transparent}#fixture .field[data-canvas-input=active] input{opacity:0}</style>
<h1>Runtime audit</h1><p>Keep this tab visible and leave the pointer still during a run. Synthetic fixture data only. Backend: <strong id="backend"></strong>.</p>
<button id="run">Run audit</button><p id="status" role="status">Ready.</p>
<table><thead><tr><th>Scenario</th><th>Frames / 1s</th><th>Bounds reads</th><th>Style reads</th><th>Callback CPU p50 / p95 (ms)</th></tr></thead><tbody id="results"></tbody></table>
<div id="fixture"></div><pre id="report"></pre>
<script type="module" src="/src/perf.ts"></script></html>
