<!--
  Webflow / IIFE embed — no bundler.

  When: a Designer embed, or any page that cannot import ESM from node_modules.
  Backend: WebGPU → WebGL2. window.Shooosh is the same public API.

  One shared layer per page. Call releaseLayer() on Webflow page teardown or
  the canvas leaks across transitions.

  Docs: docs/site-patterns.md · skill shooosh-site
-->
<canvas
  data-shooosh
  data-dpr-max="1.5"
  aria-hidden="true"
  style="position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1"
></canvas>

<script src="https://unpkg.com/shooosh"></script>
<script>
  const { createScene, parseSceneDataset } = window.Shooosh
  const canvas = document.querySelector("[data-shooosh]")

  createScene(canvas, {
    ...parseSceneDataset(canvas.dataset),
    screen: {
      shaders: {
        fragment: `
fn fsMain() -> vec4f {
  let t = uUni.values0.x;
  return vec4f(vUv, 0.5 + 0.5 * sin(t), 1.0);
}
`,
      },
      onFrame(self, frame) {
        self.setUni({ value1: frame.now * 0.001 })
      },
    },
  })
</script>
